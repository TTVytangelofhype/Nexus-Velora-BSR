name: Build NEXUS Bridge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/NexusVeloraBSR.Bridge/NexusVeloraBSR.Bridge.csproj
      - name: Build
        run: dotnet build src/NexusVeloraBSR.Bridge/NexusVeloraBSR.Bridge.csproj -c Release --no-restore
      - name: Publish standalone Windows bridge
        run: dotnet publish src/NexusVeloraBSR.Bridge/NexusVeloraBSR.Bridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/NexusVeloraBSR
      - uses: actions/upload-artifact@v4
        with:
          name: NexusVeloraBSR-win-x64
          path: dist/NexusVeloraBSR/
